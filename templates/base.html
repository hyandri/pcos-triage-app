<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PCOS Triage{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                        },
                    },
                },
            },
        };
    </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <nav class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
            <a href="{% url 'accounts:dashboard' %}" class="text-lg font-semibold text-brand-700">
                PCOS Triage
            </a>
            <div class="flex items-center gap-4 text-sm font-medium">
                {% if user.is_authenticated %}
                    <a href="{% url 'accounts:dashboard' %}" class="text-slate-600 hover:text-brand-600">
                        Dashboard
                    </a>
                    <span class="hidden text-slate-400 sm:inline">|</span>
                    <span class="hidden text-slate-500 sm:inline">{{ user.username }}</span>
                    <form method="post" action="{% url 'accounts:logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="text-slate-600 hover:text-brand-600">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}" class="text-slate-600 hover:text-brand-600">
                        Login
                    </a>
                    <a
                        href="{% url 'accounts:register' %}"
                        class="rounded-lg bg-brand-600 px-4 py-2 text-white hover:bg-brand-700"
                    >
                        Register
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% if messages %}
        <div class="mx-auto max-w-6xl px-4 pt-4 sm:px-6">
            {% for message in messages %}
                <div class="mb-2 rounded-lg border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-emerald-200 bg-emerald-50 text-emerald-800{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
