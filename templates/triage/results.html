<section x-show="result" x-transition.opacity role="status" aria-live="polite" class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-10">
    <div class="text-center">
        <span class="text-sm font-semibold uppercase tracking-[0.18em] text-brand-600">Assessment complete</span>
        <h2 class="mt-3 text-3xl font-bold text-slate-900 sm:text-4xl">Your initial risk estimate</h2>
        <p class="mx-auto mt-3 max-w-xl text-slate-600">This result is based on the symptom information you provided.</p>
    </div>

    <div class="mx-auto mt-8 max-w-md rounded-2xl border px-6 py-5 text-center" :class="riskClass()">
        <p class="text-xs font-bold uppercase tracking-[0.18em]">Risk tier</p>
        <p class="mt-2 text-4xl font-black uppercase" x-text="result?.risk_tier || '—'"></p>
    </div>

    <div class="mt-8 grid gap-4 sm:grid-cols-2">
        <div class="rounded-2xl bg-slate-50 p-5 text-center">
            <p class="text-sm font-medium text-slate-500">Probability score</p>
            <p class="mt-2 text-3xl font-bold text-slate-900" x-text="result ? formatProbability(result.positive_probability) : '—'"></p>
        </div>
        <div class="rounded-2xl bg-slate-50 p-5 text-center">
            <p class="text-sm font-medium text-slate-500">Assessment ID</p>
            <p class="mt-2 text-3xl font-bold text-slate-900" x-text="result?.assessment_id || '—'"></p>
        </div>
    </div>

    <div class="mt-8 flex flex-col-reverse justify-center gap-3 sm:flex-row">
        <a href="{% url 'accounts:dashboard' %}" class="rounded-xl border border-slate-200 px-5 py-3 text-center text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
            Back to Dashboard
        </a>
        <button type="button" @click="window.location.reload()" class="rounded-xl bg-brand-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2">
            Start another check
        </button>
    </div>
</section>
